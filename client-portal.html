<!doctype html><html lang="en"><head><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="shortcut icon" href="/favicon.svg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Dashboard | Blue Ocean Ventures</title>
<style>
:root{--navy:#102d55;--blue:#1767c9;--ink:#203a58;--muted:#607288;--line:#dbe5ef;--soft:#f5f8fc}
*{box-sizing:border-box}
body{font:16px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--soft);color:var(--ink);margin:0}
header{background:var(--navy);color:#fff;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header strong{letter-spacing:.06em;font-size:14px}
header nav{display:flex;gap:14px;align-items:center;font-size:14px}
header a{color:#dce9fb}
main{max-width:1180px;margin:26px auto;padding:0 18px}
h1{margin:0 0 4px;color:var(--navy);font-size:clamp(24px,3vw,32px)}
.lead{color:var(--muted);margin:0 0 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.btn{border:0;background:var(--blue);color:#fff;padding:10px 16px;border-radius:9px;cursor:pointer;font:700 14px system-ui}
.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn:disabled{opacity:.6;cursor:default}
.side h2{font-size:16px;margin:0;color:var(--navy)}
.side-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.convs{display:grid;gap:6px;max-height:60vh;overflow:auto}
.conv{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff;text-align:left;width:100%;font:inherit;color:inherit}
.conv:hover{border-color:#a9c4e6}
.conv.sel{border-color:var(--blue);box-shadow:0 0 0 2px #1767c933}
.conv b{display:block;color:var(--navy);font-size:14px}
.conv small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .meta{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted);margin-top:3px}
.badge{background:var(--blue);color:#fff;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800}
.tag{display:inline-block;background:#eef3f8;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;color:#3a5574}
.tag.closed{background:#f1f1ef;color:#77746c}
.projects{margin-top:14px}
.projects li{font-size:14px}
.thread{display:flex;flex-direction:column;min-height:62vh}
.thread-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}
.thread-head h2{margin:0;font-size:18px;color:var(--navy)}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 10px;max-height:52vh}
.msg{max-width:80%;border-radius:14px;padding:10px 13px;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.msg .who{font-size:11px;font-weight:800;opacity:.75;margin-bottom:2px}
.msg .when{font-size:11px;opacity:.6;margin-top:4px;text-align:right}
.msg.mine{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.theirs{align-self:flex-start;background:#eef3f8;color:var(--ink);border-bottom-left-radius:4px}
.msg.system{align-self:center;background:#fff8e6;color:#6b4b00;border:1px solid #f1dfaa;font-size:13px;max-width:92%}
.compose{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:10px}
textarea,input,select{font:inherit;font-size:15px;border:1px solid #c8d6e5;border-radius:9px;padding:10px;width:100%;background:#fff;color:var(--ink)}
.compose textarea{resize:vertical;min-height:48px;max-height:180px}
label{display:block;font-weight:700;font-size:13px;color:var(--navy);margin:10px 0 4px}
.empty{color:var(--muted);text-align:center;padding:50px 10px}
.status{font-size:13px;color:var(--muted);margin-top:6px}
.back{display:none}
.signin{max-width:520px;margin:50px auto;text-align:center}
@media(max-width:820px){.grid{grid-template-columns:1fr}.grid.reading .side{display:none}.grid:not(.reading) .main{display:none}.back{display:inline-block}.msg{max-width:90%}.msgs{max-height:58vh}}
</style></head><body>
<header><strong>BLUE OCEAN VENTURES · MY DASHBOARD</strong><nav><span id="who"></span><a href="/">Website</a><a href="/account.html">Account</a><a href="#" id="signout" hidden>Sign out</a></nav></header>
<main id="app"><div class="card signin" id="loading">Loading your dashboard…</div></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://tzpbdfbedwmawmpygwpx.supabase.co','sb_publishable_I82ausx72XBOYcWxWe83zQ_A5DGjqM4');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when=d=>{const t=new Date(d),n=new Date();return t.toDateString()===n.toDateString()?t.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):t.toLocaleDateString([],{day:'numeric',month:'short'})+' '+t.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};
const TOPICS={general:'General question',project:'My project',funding:'Funding opportunities',website:'Something on the website',other:'Other'};
let user=null,convs=[],projects=[],current=null,mode='list';

const {data:{user:u}}=await db.auth.getUser();user=u;
if(!user){$('app').innerHTML=`<div class="card signin"><h1>My Dashboard</h1><p class="lead">Sign in to ask questions, follow your project and read replies from our team.</p><a class="btn" href="/account.html">Sign in / Sign up</a></div>`;}
else start();

async function start(){
 $('who').textContent=user.email;$('signout').hidden=false;
 $('signout').onclick=async e=>{e.preventDefault();await db.auth.signOut();location.href='/'};
 $('app').innerHTML=`<h1>My Dashboard</h1><p class="lead">Ask our team anything, about your project, funding opportunities or something you saw on our website. Replies appear here.</p>
 <div class="grid" id="grid"><aside class="card side"><div class="side-head"><h2>Conversations</h2><button class="btn" id="newBtn" type="button">+ Ask a question</button></div><div class="convs" id="convs"></div>
  <div class="projects"><h2 style="font-size:15px;margin:16px 0 4px">My projects</h2><ul id="projects" style="margin:0;padding-left:18px"></ul></div></aside>
 <section class="card main" id="mainPane"></section></div>`;
 $('newBtn').onclick=()=>showNew();
 await Promise.all([loadProjects(),loadConvs()]);
 if(convs.length)openConv(convs[0].id,false);else showNew();
 listen();
 setInterval(()=>{loadConvs();if(current)loadMessages(true)},30000); // fallback if live updates are unavailable
}
async function loadProjects(){
 const {data}=await db.rpc('bov_my_projects');projects=data||[];
 $('projects').innerHTML=projects.length?projects.map(p=>`<li>${esc(p.project_name)}${p.country?` <span class="tag">${esc(p.country)}</span>`:''}</li>`).join(''):'<li style="list-style:none;margin-left:-18px;color:var(--muted);font-size:13px">No project linked yet. Our team will link your project to your account once we start working together.</li>';
}
async function loadConvs(){
 const {data,error}=await db.rpc('bov_my_conversations');
 if(error){$('convs').innerHTML=`<p class="status">Messaging is not available yet: ${esc(error.message)}</p>`;return}
 convs=data||[];
 $('convs').innerHTML=convs.length?convs.map(c=>`<button class="conv${current===c.id?' sel':''}" data-id="${c.id}" type="button"><b>${esc(c.subject)}</b><small>${esc(c.last_body||'')}</small>
  <div class="meta"><span>${c.project_name?esc(c.project_name):esc(TOPICS[c.topic]||'')}${c.status==='closed'?' · <span class="tag closed">closed</span>':''}</span><span>${c.unread?`<span class="badge">${c.unread} new</span>`:esc(when(c.last_message_at))}</span></div></button>`).join(''):'<p class="status">No conversations yet.</p>';
 $('convs').querySelectorAll('.conv').forEach(b=>b.onclick=()=>openConv(b.dataset.id,true));
}
function showNew(){
 current=null;mode='new';$('grid').classList.add('reading');loadConvs();
 $('mainPane').innerHTML=`<div class="thread-head"><div><button class="btn alt back" type="button" id="backBtn">← Back</button><h2>Ask a question</h2></div></div>
 <form id="newForm"><label for="nTopic">About</label><select id="nTopic">${Object.entries(TOPICS).filter(([k])=>k!=='project'||projects.length).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('')}</select>
 <div id="nProjWrap" hidden><label for="nProject">Project</label><select id="nProject">${projects.map(p=>`<option value="${p.project_id}">${esc(p.project_name)}</option>`).join('')}</select></div>
 <label for="nSubject">Subject</label><input id="nSubject" maxlength="200" required placeholder="e.g. Can my project apply for EU funding?">
 <label for="nBody">Your message</label><textarea id="nBody" rows="6" maxlength="5000" required placeholder="Write your question…"></textarea>
 <p class="status">Please don't send passwords, bank details or other sensitive personal information here.</p>
 <button class="btn" type="submit" id="nSend">Send</button> <span class="status" id="nStatus"></span></form>`;
 $('backBtn').onclick=()=>{$('grid').classList.remove('reading')};
 $('nTopic').onchange=e=>{$('nProjWrap').hidden=e.target.value!=='project'};
 $('newForm').onsubmit=async e=>{e.preventDefault();$('nSend').disabled=true;$('nStatus').textContent='Sending…';
  const topic=$('nTopic').value,{data,error}=await db.rpc('bov_start_conversation',{p_subject:$('nSubject').value,p_body:$('nBody').value,p_topic:topic,p_project:topic==='project'?$('nProject').value:null});
  if(error){$('nStatus').textContent='Could not send: '+error.message;$('nSend').disabled=false;return}
  await loadConvs();openConv(data,true)};
}
async function openConv(id,mobileOpen){
 current=id;mode='thread';if(mobileOpen)$('grid').classList.add('reading');
 const c=convs.find(x=>x.id===id)||{subject:'Conversation'};
 $('mainPane').innerHTML=`<div class="thread"><div class="thread-head"><div><button class="btn alt back" type="button" id="backBtn">← Back</button><h2>${esc(c.subject)}</h2>
  <div class="status">${c.project_name?'Project: '+esc(c.project_name):esc(TOPICS[c.topic]||'')}${c.status==='closed'?' · This conversation was closed by our team. Writing again will reopen it.':''}</div></div></div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <form class="compose" id="compose"><textarea id="body" rows="2" maxlength="5000" placeholder="Write a reply…" required></textarea><button class="btn" id="send" type="submit">Send</button></form></div>`;
 $('backBtn').onclick=()=>{$('grid').classList.remove('reading');loadConvs()};
 $('body').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();$('compose').requestSubmit()}};
 $('compose').onsubmit=async e=>{e.preventDefault();const v=$('body').value.trim();if(!v)return;$('send').disabled=true;
  const {error}=await db.from('bov_messages').insert({conversation_id:id,body:v});$('send').disabled=false;
  if(error){alert('Could not send: '+error.message);return}$('body').value='';await loadMessages();loadConvs()};
 await loadMessages();loadConvs();
}
async function loadMessages(quiet){
 if(!current)return;const id=current;
 const {data,error}=await db.from('bov_messages').select('id,sender_role,sender_name,body,created_at,sender_id').eq('conversation_id',id).order('created_at');
 if(error||id!==current)return;
 const box=$('msgs');if(!box)return;const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<60;
 box.innerHTML=(data||[]).map(m=>{const cls=m.sender_role==='system'?'system':m.sender_id===user.id?'mine':'theirs';
  return `<div class="msg ${cls}">${cls==='mine'?'':`<div class="who">${esc(m.sender_role==='staff'?(m.sender_name||'Blue Ocean team')+' · Blue Ocean Ventures':m.sender_name)}</div>`}${esc(m.body)}<div class="when">${esc(when(m.created_at))}</div></div>`}).join('');
 if(!quiet||atBottom)box.scrollTop=box.scrollHeight;
 db.rpc('bov_mark_read',{p_conversation:id});
}
function listen(){
 db.channel('client-messages').on('postgres_changes',{event:'INSERT',schema:'public',table:'bov_messages'},p=>{
  if(p.new?.conversation_id===current)loadMessages(true);loadConvs();
 }).subscribe();
}
</script></body></html>
