<!doctype html><html lang="en"><head><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="shortcut icon" href="/favicon.svg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Dashboard | Blue Ocean Ventures</title>
<style>
:root{--navy:#102d55;--blue:#1767c9;--ink:#203a58;--muted:#607288;--line:#dbe5ef;--soft:#f5f8fc}
*{box-sizing:border-box}
body{font:16px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--soft);color:var(--ink);margin:0}
header{background:var(--navy);color:#fff;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header strong{letter-spacing:.06em;font-size:14px}
header nav{display:flex;gap:14px;align-items:center;font-size:14px}
header a{color:#dce9fb}
main{max-width:1180px;margin:26px auto;padding:0 18px}
h1{margin:0 0 4px;color:var(--navy);font-size:clamp(24px,3vw,32px)}
.lead{color:var(--muted);margin:0 0 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.btn{border:0;background:var(--blue);color:#fff;padding:10px 16px;border-radius:9px;cursor:pointer;font:700 14px system-ui}
.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn:disabled{opacity:.6;cursor:default}
.side h2{font-size:16px;margin:0;color:var(--navy)}
.side-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.convs{display:grid;gap:6px;max-height:60vh;overflow:auto}
.conv{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff;text-align:left;width:100%;font:inherit;color:inherit}
.conv:hover{border-color:#a9c4e6}
.conv.sel{border-color:var(--blue);box-shadow:0 0 0 2px #1767c933}
.conv b{display:block;color:var(--navy);font-size:14px}
.conv small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .meta{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted);margin-top:3px}
.badge{background:var(--blue);color:#fff;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800}
.tag{display:inline-block;background:#eef3f8;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;color:#3a5574}
.tag.closed{background:#f1f1ef;color:#77746c}
.projects{margin-top:14px}
.projects li{font-size:14px}
.thread{display:flex;flex-direction:column;min-height:62vh}
.thread-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}
.thread-head h2{margin:0;font-size:18px;color:var(--navy)}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 10px;max-height:52vh}
.msg{max-width:80%;border-radius:14px;padding:10px 13px;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.msg .who{font-size:11px;font-weight:800;opacity:.75;margin-bottom:2px}
.msg .when{font-size:11px;opacity:.6;margin-top:4px;text-align:right}
.msg.mine{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.theirs{align-self:flex-start;background:#eef3f8;color:var(--ink);border-bottom-left-radius:4px}
.msg.system{align-self:center;background:#fff8e6;color:#6b4b00;border:1px solid #f1dfaa;font-size:13px;max-width:92%}
.compose{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:10px}
textarea,input,select{font:inherit;font-size:15px;border:1px solid #c8d6e5;border-radius:9px;padding:10px;width:100%;background:#fff;color:var(--ink)}
.compose textarea{resize:vertical;min-height:48px;max-height:180px}
label{display:block;font-weight:700;font-size:13px;color:var(--navy);margin:10px 0 4px}
.empty{color:var(--muted);text-align:center;padding:50px 10px}
.status{font-size:13px;color:var(--muted);margin-top:6px}
.back{display:none}
.signin{max-width:520px;margin:50px auto;text-align:center}
@media(max-width:820px){.grid{grid-template-columns:1fr}.grid.reading .side{display:none}.grid:not(.reading) .main{display:none}.back{display:inline-block}.msg{max-width:90%}.msgs{max-height:58vh}}

.tabs{display:flex;gap:6px;margin:4px 0 18px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:700 15px system-ui;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--navy);border-bottom-color:var(--blue)}
.tabs .badge{margin-left:6px}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:center;background:linear-gradient(135deg,#0f2d55,#1767c9);color:#fff;border-radius:16px;padding:26px}
.hero h2{margin:0 0 8px;font-size:24px}.hero p{margin:0 0 16px;opacity:.9}
.hero .btn{background:#fff;color:var(--navy)}
.hero ol{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.hero li{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;font-size:14px}
.hero li b{display:block}
.plist{display:grid;gap:12px;margin-top:16px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.pcard-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.pcard h3{margin:0;color:var(--navy);font-size:17px}
.pcard .sub{color:var(--muted);font-size:13px}
.pcard .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.track{display:flex;margin:14px 0 4px;gap:0}
.track div{flex:1;text-align:center;font-size:11.5px;color:var(--muted);position:relative;padding-top:20px}
.track div:before{content:"";position:absolute;top:6px;left:0;right:0;height:4px;background:#e3eaf3}
.track div:first-child:before{left:50%}.track div:last-child:before{right:50%}
.track div:after{content:"";position:absolute;top:1px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;border:3px solid #cdd9e6}
.track div.done{color:var(--navy);font-weight:700}
.track div.done:before{background:var(--blue)}
.track div.done:after{background:var(--blue);border-color:var(--blue)}
.track div.now:after{box-shadow:0 0 0 4px #1767c933}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.steps button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:700 13px system-ui;color:var(--muted);cursor:pointer}
.steps button[aria-current=step]{background:var(--navy);border-color:var(--navy);color:#fff}
.steps button.ok{color:#1b6e3c;border-color:#bfe3cb}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
.fgrid .wide{grid-column:1/-1}
.hint{font-weight:400;color:var(--muted);font-size:12.5px}
.areas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:4px}
.areas label{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13.5px;margin:0;border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;color:var(--ink)}
.areas input{width:auto;margin:0}
.areas label:has(input:checked){border-color:var(--blue);background:#eef5ff}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.drop{border:2px dashed #b9cde3;border-radius:14px;padding:24px;text-align:center;background:#f8fbff;cursor:pointer}
.drop.over{border-color:var(--blue);background:#eef5ff}
.files{display:grid;gap:8px;margin-top:12px}
.file{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;font-size:14px}
.file small{color:var(--muted)}
.review dl{display:grid;grid-template-columns:200px minmax(0,1fr);gap:6px 14px;margin:0}
.review dt{color:var(--muted);font-size:13.5px}.review dd{margin:0;font-size:14.5px;white-space:pre-wrap}
.review h3{color:var(--navy);font-size:15px;margin:18px 0 8px;display:flex;justify-content:space-between}
.review h3 button{font-size:12.5px;padding:4px 10px}
.okbox{background:#e9f7ee;border:1px solid #bfe3cb;color:#1b5e33;border-radius:12px;padding:14px 16px}
.errbox{background:#fdecec;border:1px solid #f3c2c2;color:#8a1f1f;border-radius:12px;padding:12px 14px;margin-top:10px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px;margin-top:14px}
.check input{width:auto;margin-top:4px}
@media(max-width:820px){.hero{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}.areas{grid-template-columns:1fr 1fr}.review dl{grid-template-columns:1fr}.review dt{margin-top:6px}}
</style></head><body>
<header><strong>BLUE OCEAN VENTURES · CLIENT DASHBOARD</strong><nav><span id="who"></span><a href="/">Website</a><a href="/account.html">Account</a><a href="#" id="signout" hidden>Sign out</a></nav></header>
<main id="app"><div class="card signin" id="loading">Loading your dashboard…</div></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://tzpbdfbedwmawmpygwpx.supabase.co','sb_publishable_I82ausx72XBOYcWxWe83zQ_A5DGjqM4');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when=d=>{const t=new Date(d),n=new Date();return t.toDateString()===n.toDateString()?t.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):t.toLocaleDateString([],{day:'numeric',month:'short'})+' '+t.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};
const day=d=>d?new Date(d).toLocaleDateString([],{day:'numeric',month:'short',year:'numeric'}):'';
const TOPICS={general:'General question',project:'My project',funding:'Funding opportunities',website:'Something on the website',other:'Other'};
const BUCKET='bov-hub-project-documents';
const LEGAL=['Non-Governmental Organisation (NGO) / Civil Society Organisation (CSO)','Foundation','Government body','University / Research','Private company','Individual','Other'];
const AREAS=['Education','Community development','Vocational training','Agriculture and food security','Sport and youth development','Water and sanitation','Health and wellbeing','Industry and manufacturing','Climate and environment','Renewable energy','Infrastructure and housing','Women and gender equality','Entrepreneurship and employment','Humanitarian assistance','Digital innovation'];
const OWNERSHIP={'':'Not applicable',owner:'I / we own it',co_owner:'Co-owned',company_owned:'Owned by our company',lease:'Leased',permission_of_owner:'Used with the owner’s permission',purchase_option:'Purchase option',other:'Other',unknown:'Not sure yet'};
const LANGS={en:'English',es:'Español',fr:'Français',de:'Deutsch'};
const TRACK=[['submitted','Submitted'],['under_review','Under review'],['matching','Funding matching'],['proposal_sent','Proposal sent']];
const STATUS_LABEL={draft:'Draft — not sent yet',submitted:'Submitted',under_review:'Under review',matching:'Funding matching',proposal_sent:'Proposal sent',closed:'Closed'};
const FILE_TYPES={'application/pdf':'PDF','application/vnd.openxmlformats-officedocument.wordprocessingml.document':'Word','image/jpeg':'JPG','image/png':'PNG','image/webp':'WEBP'};
const MAX_FILE=10*1024*1024;
let user=null,profile=null,convs=[],projects=[],subs=[],subsError='',current=null,tab='projects',draft=null,step=0;

const {data:{user:u}}=await db.auth.getUser();user=u;
if(!user){$('app').innerHTML=`<div class="card signin"><h1>Client Dashboard</h1><p class="lead">Sign in to submit your project, upload documents, follow its progress and talk to our team.</p><a class="btn" href="/account.html?next=submit">Sign in / Sign up</a></div>`;}
else start();

async function start(){
 $('who').textContent=user.email;$('signout').hidden=false;
 $('signout').onclick=async e=>{e.preventDefault();await db.auth.signOut();location.href='/'};
 try{const {data}=await db.from('bov_account_profiles').select('full_name,organisation').eq('user_id',user.id).maybeSingle();profile=data||null}catch(e){}
 $('app').innerHTML=`<h1>Client Dashboard</h1><p class="lead">Submit your project, upload your documents and follow its progress. Our team replies to your messages here.</p>
 <div class="tabs" role="tablist"><button role="tab" id="tabProjects" type="button">My projects</button><button role="tab" id="tabMessages" type="button">Messages<span id="unreadBadge"></span></button></div>
 <div id="view"></div>`;
 $('tabProjects').onclick=()=>show('projects');$('tabMessages').onclick=()=>show('messages');
 await Promise.all([loadSubs(),loadProjects(),loadConvs(true)]);
 if(location.hash==='#new')newProject();else show(location.hash==='#messages'?'messages':'projects');
 listen();
 setInterval(()=>{loadConvs(true);if(tab==='messages'&&current)loadMessages(true)},30000);
}
function show(t){tab=t;$('tabProjects').setAttribute('aria-selected',String(t==='projects'));$('tabMessages').setAttribute('aria-selected',String(t==='messages'));
 if(t==='projects')renderProjects();else renderMessages()}

// ---------------- Projects ----------------
async function loadSubs(){
 const {data,error}=await db.from('bov_client_submissions').select('*').order('updated_at',{ascending:false});
 subsError=error?error.message:'';subs=data||[];
}
async function loadProjects(){const {data}=await db.rpc('bov_my_projects');projects=data||[]}
function tracker(status){
 const idx=TRACK.findIndex(t=>t[0]===status);
 return `<div class="track">${TRACK.map(([k,l],i)=>`<div class="${status==='closed'||i<=idx?'done':''}${i===idx?' now':''}">${esc(l)}</div>`).join('')}</div>`;
}
function renderProjects(){
 draft=null;const v=$('view');
 if(subsError){v.innerHTML=`<div class="card"><p>Project submissions are being set up. Please try again shortly, or send us a message in the Messages tab.</p><p class="status">${esc(subsError)}</p></div>`;return}
 const linked=projects.filter(p=>!subs.some(s=>s.project_id===p.project_id));
 const hero=`<div class="hero"><div><h2>Submit your project</h2><p>Tell us about your project and upload your documents. We will look for matching UN and EU funding and keep you updated here.</p><button class="btn" type="button" id="newBtn">+ Start a new project</button></div>
  <ol><li><b>1 · Describe your project</b>About you, the project, budget and timeline. Your answers are saved as you go.</li><li><b>2 · Upload documents</b>PDF, Word or photos, up to 10 MB each.</li><li><b>3 · Submit and follow</b>See the status and talk to our team.</li></ol></div>`;
 const cards=subs.map(s=>{
  const isDraft=s.status==='draft';
  return `<div class="pcard"><div class="pcard-head"><div><h3>${esc(s.project_title||'Untitled project')}</h3><div class="sub">${esc([s.country,s.region].filter(Boolean).join(' · '))}${s.submitted_at?' · submitted '+esc(day(s.submitted_at)):' · last saved '+esc(day(s.updated_at))}</div></div>
   <span class="tag${s.status==='closed'?' closed':''}">${esc(STATUS_LABEL[s.status]||s.status)}</span></div>
   ${isDraft?'<p class="status">This project has not been sent yet. Continue to finish and submit it.</p>':tracker(s.status)}
   <div class="actions">${isDraft?`<button class="btn" type="button" data-edit="${s.id}">Continue</button><button class="btn alt" type="button" data-del="${s.id}">Delete draft</button>`:`<button class="btn alt" type="button" data-view="${s.id}">View submission</button>${s.conversation_id?`<button class="btn alt" type="button" data-chat="${s.conversation_id}">Messages about this project</button>`:''}`}</div></div>`}).join('');
 const lcards=linked.map(p=>`<div class="pcard"><div class="pcard-head"><div><h3>${esc(p.project_name)}</h3><div class="sub">${esc(p.country||'')} · managed with our team</div></div><span class="tag">In progress</span></div></div>`).join('');
 const slim=`<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px"><span><strong style="color:var(--navy)">Have another project?</strong> <span class="status">Describe it, upload documents and submit.</span></span><button class="btn" type="button" id="newBtn">+ Start a new project</button></div>`;
 v.innerHTML=(subs.length||linked.length?slim:hero)+`<div class="plist">${cards+lcards||'<p class="status" style="text-align:center;padding:12px">You have no projects yet.</p>'}</div>`;
 $('newBtn').onclick=newProject;
 v.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editProject(b.dataset.edit));
 v.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>viewProject(b.dataset.view));
 v.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{show('messages');openConv(b.dataset.chat,true)});
 v.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this draft and its documents?'))return;
  const {data:files}=await db.from('bov_client_submission_files').select('storage_path').eq('submission_id',b.dataset.del);
  if(files?.length)await db.storage.from(BUCKET).remove(files.map(f=>f.storage_path));
  const {error}=await db.from('bov_client_submissions').delete().eq('id',b.dataset.del);if(error){alert('Could not delete: '+error.message);return}
  await loadSubs();renderProjects()});
}
function newProject(){
 show('projects');
 draft={id:null,status:'draft',contact_name:profile?.full_name||'',organisation_name:profile?.organisation||'',applicant_type:'',registration_country:'',contact_phone:'',project_title:'',country:'',region:'',site_address:'',ownership_type:'',project_areas:[],description:'',beneficiaries:'',jobs_created:null,currency:'EUR',total_budget:null,funding_requested:null,own_contribution:null,planned_start:null,duration_months:null,submission_language:'en'};
 step=0;renderForm();
}
async function editProject(id){const s=subs.find(x=>x.id===id);if(!s)return;draft={...s};step=0;renderForm()}

const STEPS=['About you','Your project','Budget & timeline','Documents','Review & submit'];
const COUNTRY_OPTIONS=(()=>{try{const dn=new Intl.DisplayNames(['en'],{type:'region'}),L='ABCDEFGHIJKLMNOPQRSTUVWXYZ',out=new Set();for(const a of L)for(const b of L){try{const n=dn.of(a+b);if(n&&n!==a+b&&!/Unknown|Region|^World|Outlying|Pseudo|European Union|Eurozone|United Nations/.test(n))out.add(n)}catch(e){}}return [...out].sort()}catch(e){return []}})();
function field(id,label,html,cls=''){return `<div class="${cls}"><label for="${id}">${label}</label>${html}</div>`}
function countrySel(id,val){const opts=COUNTRY_OPTIONS.includes(val)||!val?COUNTRY_OPTIONS:[val,...COUNTRY_OPTIONS];return `<select id="${id}"><option value="">Choose a country…</option>${opts.map(c=>`<option ${c===val?'selected':''}>${esc(c)}</option>`).join('')}</select>`}
function inp(id,val,attrs=''){return `<input id="${id}" value="${esc(val??'')}" ${attrs}>`}
function renderForm(msg){
 const d=draft,v=$('view');
 const stepsBar=`<div class="steps">${STEPS.map((s,i)=>`<button type="button" data-step="${i}" ${i===step?'aria-current="step"':''}>${i+1}. ${esc(s)}</button>`).join('')}</div>`;
 let body='';
 if(step===0)body=`<div class="fgrid">
  ${field('fName','Your full name *',inp('fName',d.contact_name,'maxlength="160" autocomplete="name"'))}
  ${field('fPhone','Phone <span class="hint">(optional)</span>',inp('fPhone',d.contact_phone,'maxlength="60" autocomplete="tel"'))}
  ${field('fOrg','Organisation or company name <span class="hint">(leave empty if you apply as an individual)</span>',inp('fOrg',d.organisation_name,'maxlength="240" autocomplete="organization"'),'wide')}
  ${field('fType','Legal type *',`<select id="fType"><option value="">Choose…</option>${LEGAL.map(l=>`<option ${d.applicant_type===l?'selected':''}>${esc(l)}</option>`).join('')}</select>`)}
  ${field('fRegCountry','Country of registration / residence',countrySel('fRegCountry',d.registration_country))}
  ${field('fLang','Language of your answers',`<select id="fLang">${Object.entries(LANGS).map(([k,l])=>`<option value="${k}" ${d.submission_language===k?'selected':''}>${l}</option>`).join('')}</select>`)}
 </div>`;
 if(step===1)body=`<div class="fgrid">
  ${field('fTitle','Project title *',inp('fTitle',d.project_title,'maxlength="240" placeholder="e.g. Agrotourism and vineyard on rustic land in Tenerife"'),'wide')}
  ${field('fCountry','Country where the project takes place *',countrySel('fCountry',d.country))}
  ${field('fRegion','Region / city',inp('fRegion',d.region,'maxlength="160" placeholder="e.g. Tenerife, Canary Islands"'))}
  <div class="wide"><label>Project areas * <span class="hint">(select all that apply)</span></label><div class="areas">${AREAS.map(a=>`<label><input type="checkbox" value="${esc(a)}" ${d.project_areas?.includes(a)?'checked':''}>${esc(a)}</label>`).join('')}</div></div>
  ${field('fDesc','Describe your project * <span class="hint">(objectives, main activities, what makes it special — at least 50 characters)</span>',`<textarea id="fDesc" rows="6" maxlength="8000">${esc(d.description)}</textarea>`,'wide')}
  ${field('fBen','Who will benefit? <span class="hint">(optional)</span>',`<textarea id="fBen" rows="3" maxlength="3000" placeholder="e.g. 40 young people from rural families, local farmers…">${esc(d.beneficiaries)}</textarea>`,'wide')}
  ${field('fJobs','Jobs created <span class="hint">(optional)</span>',inp('fJobs',d.jobs_created,'type="number" min="0" max="100000"'))}
  ${field('fOwn','Does the project use land or buildings?',`<select id="fOwn">${Object.entries(OWNERSHIP).map(([k,l])=>`<option value="${k}" ${(d.ownership_type||'')===k?'selected':''}>${esc(l)}</option>`).join('')}</select>`)}
  ${field('fSite','Site address <span class="hint">(optional)</span>',inp('fSite',d.site_address,'maxlength="300"'),'wide')}
 </div>`;
 if(step===2)body=`<div class="fgrid">
  ${field('fCur','Currency',`<select id="fCur">${['EUR','GBP','USD','CHF'].map(c=>`<option ${d.currency===c?'selected':''}>${c}</option>`).join('')}</select>`)}
  ${field('fTotal','Total project budget',inp('fTotal',d.total_budget,'type="number" min="0" step="1000"'))}
  ${field('fReq','Funding you are looking for',inp('fReq',d.funding_requested,'type="number" min="0" step="1000"'))}
  ${field('fOwnC','Your own contribution <span class="hint">(optional)</span>',inp('fOwnC',d.own_contribution,'type="number" min="0" step="1000"'))}
  ${field('fStart','Planned start <span class="hint">(optional)</span>',inp('fStart',d.planned_start,'type="date"'))}
  ${field('fDur','Duration in months <span class="hint">(optional)</span>',inp('fDur',d.duration_months,'type="number" min="1" max="240"'))}
 </div><p class="status">Rough figures are fine at this stage. Our team will help you refine the budget.</p>`;
 if(step===3)body=`<p>Upload anything that helps us understand your project, for example: a project description or business plan, a budget, registration papers of your organisation, land registry or property documents, permits, photos of the site.</p>
  <div class="drop" id="drop" tabindex="0" role="button"><strong>Click to choose files</strong> or drag them here<div class="status">PDF, Word (.docx), JPG, PNG or WEBP · up to 10 MB each</div></div>
  <input type="file" id="fileInput" multiple accept=".pdf,.docx,image/jpeg,image/png,image/webp" hidden>
  <div class="files" id="fileList"><p class="status">Loading your documents…</p></div>`;
 if(step===4)body=reviewHtml(d,true);
 v.innerHTML=`<div class="card"><div class="navrow" style="margin:0 0 12px"><h2 style="margin:0;color:var(--navy)">${d.id?'Your project':'New project'}</h2><button class="btn alt" type="button" id="backList">← Back to my projects</button></div>${stepsBar}
  <form id="pform" novalidate>${body}
  <div id="formMsg">${msg?`<div class="${msg.ok?'okbox':'errbox'}">${esc(msg.text)}</div>`:''}</div>
  <div class="navrow"><span>${step>0?'<button class="btn alt" type="button" id="prevBtn">← Previous</button>':''}</span>
   <span style="display:flex;gap:8px;align-items:center"><span class="status" id="saveState"></span>${step<4?'<button class="btn alt" type="button" id="saveBtn">Save draft</button><button class="btn" type="submit" id="nextBtn">Save & continue →</button>':`<button class="btn" type="submit" id="submitBtn">Submit my project</button>`}</span></div></form></div>`;
 $('backList').onclick=async()=>{if(step<3)await save(true);await loadSubs();renderProjects()};
 v.querySelectorAll('[data-step]').forEach(b=>b.onclick=async()=>{const t=+b.dataset.step;if(t===step)return;if(step<3&&!(await save(true)))return;if(t>=3&&!draft.id&&!(await save(false)))return;step=t;renderForm()});
 if($('prevBtn'))$('prevBtn').onclick=async()=>{if(step<3)await save(true);step--;renderForm()};
 if($('saveBtn'))$('saveBtn').onclick=async()=>{if(await save(false))$('saveState').textContent='Saved '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};
 v.querySelectorAll('.review [data-goto]').forEach(b=>b.onclick=()=>{step=+b.dataset.goto;renderForm()});
 $('pform').onsubmit=async e=>{e.preventDefault();if(step<4){if(step<3&&!(await save(false)))return;if(step===3&&!draft.id&&!(await save(false)))return;step++;renderForm();window.scrollTo(0,0)}else submit()};
 if(step===3)setupFiles();
}
function collect(){
 const val=id=>$(id)?.value.trim();const num=id=>{const x=$(id)?.value;return x===''||x==null?null:Number(x)};
 if(step===0)Object.assign(draft,{contact_name:val('fName'),contact_phone:val('fPhone'),organisation_name:val('fOrg'),applicant_type:val('fType'),registration_country:val('fRegCountry'),submission_language:val('fLang')});
 if(step===1)Object.assign(draft,{project_title:val('fTitle'),country:val('fCountry'),region:val('fRegion'),project_areas:[...document.querySelectorAll('.areas input:checked')].map(c=>c.value),description:$('fDesc').value.trim(),beneficiaries:$('fBen').value.trim(),jobs_created:num('fJobs'),ownership_type:val('fOwn')||null,site_address:val('fSite')});
 if(step===2)Object.assign(draft,{currency:val('fCur'),total_budget:num('fTotal'),funding_requested:num('fReq'),own_contribution:num('fOwnC'),planned_start:val('fStart')||null,duration_months:num('fDur')});
}
function problems(d,forSubmit){
 const p=[];
 if(!d.contact_name)p.push([0,'your full name']);
 if(!d.applicant_type)p.push([0,'your legal type']);
 if(forSubmit||step>=1){if(!d.project_title||d.project_title.length<3)p.push([1,'a project title']);if(!d.country)p.push([1,'the country of the project']);if(!d.project_areas?.length)p.push([1,'at least one project area']);if((d.description||'').length<50)p.push([1,'a project description of at least 50 characters'])}
 return p;
}
async function save(quiet){
 collect();
 if(!quiet&&step<=1){const p=problems(draft,false).filter(x=>x[0]<=step);if(p.length){$('formMsg').innerHTML=`<div class="errbox">Please add ${esc(p.map(x=>x[1]).join(', '))}.</div>`;return false}}
 const cols=['contact_name','contact_phone','organisation_name','applicant_type','registration_country','project_title','country','region','site_address','ownership_type','project_areas','description','beneficiaries','jobs_created','currency','total_budget','funding_requested','own_contribution','planned_start','duration_months','submission_language'];
 const row=Object.fromEntries(cols.map(c=>[c,draft[c]===''?null:draft[c]]));row.project_areas=draft.project_areas||[];row.currency=draft.currency||'EUR';row.submission_language=draft.submission_language||'en';
 if(!row.project_title&&!draft.id&&quiet)return true; // nothing worth saving yet
 const q=draft.id?db.from('bov_client_submissions').update(row).eq('id',draft.id).select().single():db.from('bov_client_submissions').insert(row).select().single();
 const {data,error}=await q;
 if(error){if($('formMsg'))$('formMsg').innerHTML=`<div class="errbox">Could not save: ${esc(error.message)}</div>`;return false}
 draft={...draft,...data};return true;
}
async function setupFiles(){
 const drop=$('drop'),input=$('fileInput');
 drop.onclick=()=>input.click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();input.click()}};
 drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');
 drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');upload([...e.dataTransfer.files])};
 input.onchange=()=>{upload([...input.files]);input.value=''};
 await listFiles();
}
async function listFiles(){
 const box=$('fileList');if(!box)return;
 const {data,error}=await db.from('bov_client_submission_files').select('id,file_name,storage_path,mime_type,file_size,created_at').eq('submission_id',draft.id).order('created_at');
 if(error){box.innerHTML=`<p class="status">Documents unavailable: ${esc(error.message)}</p>`;return}
 draft._files=data||[];
 box.innerHTML=draft._files.length?draft._files.map(f=>`<div class="file"><span>📄 ${esc(f.file_name)} <small>${FILE_TYPES[f.mime_type]||''} · ${f.file_size<1048576?Math.max(1,Math.round(f.file_size/1024))+' KB':(f.file_size/1048576).toFixed(1)+' MB'}</small></span>${draft.status==='draft'?`<button class="btn alt" type="button" data-rm="${f.id}">Remove</button>`:''}</div>`).join(''):'<p class="status">No documents yet. Documents are optional, but they help us find the right funding faster.</p>';
 box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{const f=draft._files.find(x=>x.id===b.dataset.rm);b.disabled=true;
  const {error}=await db.from('bov_client_submission_files').delete().eq('id',f.id);if(error){alert('Could not remove: '+error.message);b.disabled=false;return}
  await db.storage.from(BUCKET).remove([f.storage_path]);listFiles()});
}
async function upload(files){
 const box=$('fileList');
 for(const file of files){
  const type=file.type||(file.name.toLowerCase().endsWith('.docx')?'application/vnd.openxmlformats-officedocument.wordprocessingml.document':file.name.toLowerCase().endsWith('.pdf')?'application/pdf':'');
  const note=document.createElement('p');note.className='status';box.prepend(note);
  if(!FILE_TYPES[type]){note.textContent=file.name+': this file type is not accepted. Please use PDF, Word (.docx) or an image.';continue}
  if(file.size>MAX_FILE){note.textContent=file.name+': too large (maximum 10 MB).';continue}
  note.textContent='Uploading '+file.name+'…';
  const safe=file.name.normalize('NFKD').replace(/[^\w.\- ]+/g,'').replace(/\s+/g,'-').slice(-120)||'document';
  const path=`client/${user.id}/${draft.id}/${Date.now()}-${safe}`;
  const up=await db.storage.from(BUCKET).upload(path,file,{contentType:type,upsert:false});
  if(up.error){note.textContent=file.name+': upload failed — '+up.error.message;continue}
  const {error}=await db.from('bov_client_submission_files').insert({submission_id:draft.id,file_name:file.name.slice(0,240),storage_path:path,mime_type:type,file_size:file.size});
  if(error){await db.storage.from(BUCKET).remove([path]);note.textContent=file.name+': could not be saved — '+error.message;continue}
  note.remove();
 }
 await listFiles();
}
function money(n,c){return n==null?'—':new Intl.NumberFormat('en-GB',{style:'currency',currency:c||'EUR',maximumFractionDigits:0}).format(n)}
function reviewHtml(d,editable){
 const sec=(title,i,rows)=>`<h3>${esc(title)}${editable?`<button class="btn alt" type="button" data-goto="${i}">Edit</button>`:''}</h3><dl>${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v==null||v===''?'<span class="hint">—</span>':esc(v)}</dd>`).join('')}</dl>`;
 const files=(d._files||[]).map(f=>f.file_name).join('\n');
 const miss=editable?problems(d,true):[];
 return `<div class="review">${miss.length?`<div class="errbox">Before submitting, please add ${esc(miss.map(x=>x[1]).join(', '))}.</div>`:''}
  ${sec('About you',0,[['Name',d.contact_name],['Phone',d.contact_phone],['Organisation',d.organisation_name||'Individual applicant'],['Legal type',d.applicant_type],['Registered in',d.registration_country],['Language',LANGS[d.submission_language]]])}
  ${sec('Your project',1,[['Title',d.project_title],['Location',[d.region,d.country].filter(Boolean).join(', ')],['Project areas',(d.project_areas||[]).join(', ')],['Description',d.description],['Beneficiaries',d.beneficiaries],['Jobs created',d.jobs_created],['Land or buildings',d.ownership_type?OWNERSHIP[d.ownership_type]:''],['Site address',d.site_address]])}
  ${sec('Budget & timeline',2,[['Total budget',money(d.total_budget,d.currency)],['Funding sought',money(d.funding_requested,d.currency)],['Own contribution',money(d.own_contribution,d.currency)],['Planned start',d.planned_start?day(d.planned_start):''],['Duration',d.duration_months?d.duration_months+' months':'']])}
  ${sec('Documents',3,[['Uploaded',files||'No documents']])}
  ${editable?`<label class="check"><input type="checkbox" id="consent"> I confirm the information is correct to the best of my knowledge, and I agree that Blue Ocean Ventures may use it and my documents to assess my project and look for funding, as described in the website terms and privacy notice.</label>`:''}</div>`;
}
async function submit(){
 if(!draft._files){const {data}=await db.from('bov_client_submission_files').select('file_name').eq('submission_id',draft.id);draft._files=data||[]}
 const miss=problems(draft,true);
 if(miss.length){$('formMsg').innerHTML=`<div class="errbox">Please add ${esc(miss.map(x=>x[1]).join(', '))}.</div>`;return}
 if(!$('consent').checked){$('formMsg').innerHTML='<div class="errbox">Please tick the confirmation box to submit.</div>';return}
 $('submitBtn').disabled=true;$('formMsg').innerHTML='<p class="status">Submitting…</p>';
 const {data,error}=await db.rpc('bov_submit_client_project',{p_submission:draft.id});
 if(error){$('formMsg').innerHTML=`<div class="errbox">${esc(error.message)}</div>`;$('submitBtn').disabled=false;return}
 await Promise.all([loadSubs(),loadProjects(),loadConvs(true)]);
 $('view').innerHTML=`<div class="card"><div class="okbox"><h2 style="margin:0 0 6px">Thank you — your project has been submitted.</h2>Our team will review it and look for matching UN and EU funding. ${data?.documents?data.documents+' document(s) were received. ':''}You can follow its status under <strong>My projects</strong>, and we will message you in <strong>Messages</strong>.</div>
  <div class="navrow"><button class="btn" type="button" id="toList">See my projects</button><button class="btn alt" type="button" id="toChat">Open messages</button></div></div>`;
 $('toList').onclick=()=>renderProjects();$('toChat').onclick=()=>{show('messages');if(data?.conversation_id)openConv(data.conversation_id,true)};
}
async function viewProject(id){
 const s=subs.find(x=>x.id===id);if(!s)return;
 const {data}=await db.from('bov_client_submission_files').select('file_name').eq('submission_id',id);
 $('view').innerHTML=`<div class="card"><div class="navrow" style="margin:0 0 6px"><h2 style="margin:0;color:var(--navy)">${esc(s.project_title)}</h2><button class="btn alt" type="button" id="backList">← Back to my projects</button></div>
  <div class="status">Submitted ${esc(day(s.submitted_at))} · ${esc(STATUS_LABEL[s.status])}</div>${tracker(s.status)}${reviewHtml({...s,_files:data||[]},false)}
  <p class="status">Need to change something? Send us a message and we will update it for you.</p>${s.conversation_id?'<button class="btn" type="button" id="chatBtn">Message us about this project</button>':''}</div>`;
 $('backList').onclick=renderProjects;if($('chatBtn'))$('chatBtn').onclick=()=>{show('messages');openConv(s.conversation_id,true)};
}

// ---------------- Messages ----------------
function renderMessages(){
 $('view').innerHTML=`<div class="grid" id="grid"><aside class="card side"><div class="side-head"><h2>Conversations</h2><button class="btn" id="newMsgBtn" type="button">+ Ask a question</button></div><div class="convs" id="convs"></div></aside>
 <section class="card main" id="mainPane"></section></div>`;
 $('newMsgBtn').onclick=()=>showNew();
 drawConvs();
 if(current&&convs.some(c=>c.id===current))openConv(current,false);else if(convs.length)openConv(convs[0].id,false);else showNew();
}
async function loadConvs(quiet){
 const {data,error}=await db.rpc('bov_my_conversations');
 if(error){if($('convs'))$('convs').innerHTML=`<p class="status">Messaging is not available yet: ${esc(error.message)}</p>`;return}
 convs=data||[];
 const unread=convs.reduce((a,c)=>a+(c.unread||0),0);if($('unreadBadge'))$('unreadBadge').innerHTML=unread?` <span class="badge">${unread}</span>`:'';
 drawConvs();
}
function drawConvs(){
 if(!$('convs'))return;
 $('convs').innerHTML=convs.length?convs.map(c=>`<button class="conv${current===c.id?' sel':''}" data-id="${c.id}" type="button"><b>${esc(c.subject)}</b><small>${esc(c.last_body||'')}</small>
  <div class="meta"><span>${c.project_name?esc(c.project_name):esc(TOPICS[c.topic]||'')}${c.status==='closed'?' · <span class="tag closed">closed</span>':''}</span><span>${c.unread?`<span class="badge">${c.unread} new</span>`:esc(when(c.last_message_at))}</span></div></button>`).join(''):'<p class="status">No conversations yet.</p>';
 $('convs').querySelectorAll('.conv').forEach(b=>b.onclick=()=>openConv(b.dataset.id,true));
}
function showNew(){
 current=null;$('grid').classList.add('reading');drawConvs();
 $('mainPane').innerHTML=`<div class="thread-head"><div><button class="btn alt back" type="button" id="backBtn">← Back</button><h2>Ask a question</h2></div></div>
 <form id="newForm"><label for="nTopic">About</label><select id="nTopic">${Object.entries(TOPICS).filter(([k])=>k!=='project'||projects.length).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('')}</select>
 <div id="nProjWrap" hidden><label for="nProject">Project</label><select id="nProject">${projects.map(p=>`<option value="${p.project_id}">${esc(p.project_name)}</option>`).join('')}</select></div>
 <label for="nSubject">Subject</label><input id="nSubject" maxlength="200" required placeholder="e.g. Can my project apply for EU funding?">
 <label for="nBody">Your message</label><textarea id="nBody" rows="6" maxlength="5000" required placeholder="Write your question…"></textarea>
 <p class="status">Please don't send passwords, bank details or other sensitive personal information here. To send documents, use <strong>My projects</strong>.</p>
 <button class="btn" type="submit" id="nSend">Send</button> <span class="status" id="nStatus"></span></form>`;
 $('backBtn').onclick=()=>{$('grid').classList.remove('reading')};
 $('nTopic').onchange=e=>{$('nProjWrap').hidden=e.target.value!=='project'};
 $('newForm').onsubmit=async e=>{e.preventDefault();$('nSend').disabled=true;$('nStatus').textContent='Sending…';
  const topic=$('nTopic').value,{data,error}=await db.rpc('bov_start_conversation',{p_subject:$('nSubject').value,p_body:$('nBody').value,p_topic:topic,p_project:topic==='project'?$('nProject').value:null});
  if(error){$('nStatus').textContent='Could not send: '+error.message;$('nSend').disabled=false;return}
  await loadConvs();openConv(data,true)};
}
async function openConv(id,mobileOpen){
 current=id;if(!$('mainPane'))return;if(mobileOpen)$('grid').classList.add('reading');
 const c=convs.find(x=>x.id===id)||{subject:'Conversation'};
 $('mainPane').innerHTML=`<div class="thread"><div class="thread-head"><div><button class="btn alt back" type="button" id="backBtn">← Back</button><h2>${esc(c.subject)}</h2>
  <div class="status">${c.project_name?'Project: '+esc(c.project_name):esc(TOPICS[c.topic]||'')}${c.status==='closed'?' · This conversation was closed by our team. Writing again will reopen it.':''}</div></div></div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <form class="compose" id="compose"><textarea id="body" rows="2" maxlength="5000" placeholder="Write a reply…" required></textarea><button class="btn" id="send" type="submit">Send</button></form></div>`;
 $('backBtn').onclick=()=>{$('grid').classList.remove('reading');loadConvs()};
 $('body').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();$('compose').requestSubmit()}};
 $('compose').onsubmit=async e=>{e.preventDefault();const v=$('body').value.trim();if(!v)return;$('send').disabled=true;
  const {error}=await db.from('bov_messages').insert({conversation_id:id,body:v});$('send').disabled=false;
  if(error){alert('Could not send: '+error.message);return}$('body').value='';await loadMessages();loadConvs()};
 drawConvs();await loadMessages();loadConvs();
}
async function loadMessages(quiet){
 if(!current)return;const id=current;
 const {data,error}=await db.from('bov_messages').select('id,sender_role,sender_name,body,created_at,sender_id').eq('conversation_id',id).order('created_at');
 if(error||id!==current)return;
 const box=$('msgs');if(!box)return;const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<60;
 box.innerHTML=(data||[]).map(m=>{const cls=m.sender_role==='system'?'system':m.sender_id===user.id?'mine':'theirs';
  return `<div class="msg ${cls}">${cls==='mine'?'':`<div class="who">${esc(m.sender_role==='staff'?(m.sender_name||'Blue Ocean team')+' · Blue Ocean Ventures':m.sender_name)}</div>`}${esc(m.body)}<div class="when">${esc(when(m.created_at))}</div></div>`}).join('');
 if(!quiet||atBottom)box.scrollTop=box.scrollHeight;
 db.rpc('bov_mark_read',{p_conversation:id});
}
function listen(){
 db.channel('client-messages').on('postgres_changes',{event:'INSERT',schema:'public',table:'bov_messages'},async p=>{
  if(tab==='messages'&&p.new?.conversation_id===current)loadMessages(true);
  await loadConvs(true);
  if(tab==='projects'&&!draft){await loadSubs();if($('view')&&!$('pform'))renderProjects()}
 }).subscribe();
}
</script></body></html>
